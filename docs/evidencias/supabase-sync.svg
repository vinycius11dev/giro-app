<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Evidência de sincronização do Giro com Supabase</title>
  <desc id="desc">Resumo de dados de demonstração lidos diretamente do Supabase: quatro produtos, duas ações e um registro de estado.</desc>
  <rect width="1200" height="850" rx="28" fill="#F6F8F4"/>
  <rect x="0" y="0" width="1200" height="10" rx="5" fill="#0D6A49"/>

