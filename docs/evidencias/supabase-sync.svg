    <path d="M64 766h1072" stroke="#DDE5DA"/>
    <text x="64" y="800" fill="#748078" font-size="11">Evidência de leitura real da Supabase Data API · ambiente acadêmico</text>
    <text x="1136" y="800" text-anchor="end" fill="#748078" font-size="11">IDs de conta e credenciais omitidos</text>
