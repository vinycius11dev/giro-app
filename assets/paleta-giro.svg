<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Paleta de cores da marca Giro</title>
  <desc id="desc">Seis amostras de cor para a identidade visual do Giro, com nome, código hexadecimal e função de cada cor.</desc>
  <rect width="1100" height="500" rx="28" fill="#FBFAF6"/>

  <circle cx="65" cy="54" r="18" fill="#E9F6D5"/>
  <path d="M58 58c0-10 8-16 17-17-1 9-6 17-17 17Zm0 0c4-5 8-8 13-11" fill="none" stroke="#0D6A49" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="54" fill="#1B3528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">GIRO  /  IDENTIDADE VISUAL</text>
  <text x="48" y="102" fill="#1B3528" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Paleta de cores</text>
  <text x="1052" y="99" text-anchor="end" fill="#748078" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">NATUREZA · CONFIANÇA · AÇÃO</text>

